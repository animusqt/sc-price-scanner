name: Build SC Price Scanner & Overlay

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ============================================================
  # Python Scanner Build (Windows/macOS/Linux)
  # ============================================================
  build-scanner:
    name: Build Scanner (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            exe: SC-Price-Scanner.exe
            artifact: scanner-win
          - os: macos-latest
            name: macos
            exe: SC-Price-Scanner-mac
            artifact: scanner-mac
          - os: ubuntu-latest
            name: linux
            exe: SC-Price-Scanner-linux
            artifact: scanner-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            echo "Windows - using winget"
            winget install --id UB-Mannheim.TesseractOCR --silent --accept-source-agreements --accept-package-agreements
          elif [ "$RUNNER_OS" = "macOS" ]; then
            echo "macOS - using brew"
            brew install tesseract
          else
            echo "Linux - using apt"
            sudo apt-get update && sudo apt-get install -y tesseract-ocr libtesseract-dev
          fi

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install pyinstaller mss opencv-python pytesseract pillow pynput numpy

      - name: Prepare tessdata
        run: |
          mkdir -p tessdata
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "C:/Program Files/Tesseract-OCR/tessdata/eng.traineddata" tessdata/
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cp "$(brew --prefix)/share/tessdata/eng.traineddata" tessdata/
          else
            cp /usr/share/tesseract-ocr/5/tessdata/eng.traineddata tessdata/ 2>/dev/null || \
            cp /usr/share/tessdata/eng.traineddata tessdata/ 2>/dev/null || \
            echo "Warning: eng.traineddata not found, OCR may not work"
          fi

      - name: Build scanner executable
        run: |
          cd sc_price_scanner
          python build_scanner.py

      - name: Verify build
        run: |
          ls -la sc_price_scanner/dist/
          file sc_price_scanner/dist/* 2>/dev/null || true

      - name: Upload scanner artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: sc_price_scanner/dist/*
          retention-days: 30

  # ============================================================
  # Electron Overlay Build (Windows/macOS/Linux)
  # ============================================================
  build-overlay:
    name: Build Overlay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            artifact: overlay-win
          - os: macos-latest
            name: macos
            artifact: overlay-mac
          - os: ubuntu-latest
            name: linux
            artifact: overlay-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sc_price_scanner/electron-overlay/package-lock.json

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2

      - name: Install dependencies
        run: |
          cd sc_price_scanner/electron-overlay
          npm ci

      - name: Build overlay
        run: |
          cd sc_price_scanner/electron-overlay
          npm run build

      - name: Verify build
        run: |
          ls -la sc_price_scanner/electron-overlay/dist/
          file sc_price_scanner/electron-overlay/dist/* 2>/dev/null || true

      - name: Upload overlay artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: sc_price_scanner/electron-overlay/dist/**
          retention-days: 30

  # ============================================================
  # Create GitHub Release
  # ============================================================
  release:
    name: Create Release
    needs: [build-scanner, build-overlay]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Organize release files
        run: |
          mkdir -p release
          
          # Scanner binaries
          mv artifacts/scanner-win/* release/ 2>/dev/null || true
          mv artifacts/scanner-mac/* release/ 2>/dev/null || true
          mv artifacts/scanner-linux/* release/ 2>/dev/null || true
          
          # Overlay installers
          mv artifacts/overlay-win/* release/ 2>/dev/null || true
          mv artifacts/overlay-mac/* release/ 2>/dev/null || true
          mv artifacts/overlay-linux/* release/ 2>/dev/null || true
          
          # Rename for clarity
          cd release
          for f in *; do
            # Normalize names
            mv "$f" "$(echo "$f" | sed 's/SC-Price-Scanner-/scanner-/; s/SC-Price-Scanner-Overlay-/overlay-/')" 2>/dev/null || true
          done
          
          ls -la

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SC Price Scanner ${{ github.ref_name }}
          body: |
            ## SC Price Scanner ${{ github.ref_name }}
            
            ### 📥 Downloads
            
            **Standalone Scanner (CLI, hotkey-based):**
            - Windows: \`scanner-win.exe\`
            - macOS: \`scanner-mac\` (run \`chmod +x scanner-mac\`)
            - Linux: \`scanner-linux\` (run \`chmod +x scanner-linux\`)
            
            **Electron Overlay (Always-on-top GUI):**
            - Windows: \`overlay-win.exe\` (NSIS installer) or \`overlay-win-portable.exe\`
            - macOS: \`overlay-mac.dmg\`
            - Linux: \`overlay-linux.AppImage\`
            
            ### 🔧 Usage
            
            **Scanner (CLI):**
            1. Run the executable
            2. Press **F8** once to calibrate (click corners of commodity terminal)
            3. In-game: open commodity kiosk → press **F9** to scan
            4. JSON scans saved to \`~/SC-Scans/\`
            5. Drag \`.json\` into SC-Truckers Market page → "Import Scan"
            
            **Overlay (GUI):**
            1. Install/run the overlay app
            2. It stays always-on-top (pin to corner of screen)
            3. Click "Scan Terminal" or press **F9** in-game
            4. Results appear in overlay, auto-saves JSON
            5. Click "Upload to SC-Truckers" to send directly
            
            ### 🛡️ Safety
            - **No game injection, no memory reads, no hooks**
            - Uses Windows Desktop Duplication API (same as OBS/Discord)
            - Runs as standard user, no admin required
            - Near-zero ban risk — purely external screen capture + OCR
            
            ### 📋 Checksums
            See \`SHA256SUMS.txt\` for file verification.
          draft: false
          prerelease: false
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Publish to npm (optional, for overlay)
  # ============================================================
