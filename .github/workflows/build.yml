name: Build SC Price Scanner and Overlay

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ============================================================
  # Python Scanner Build (Windows/macOS/Linux)
  # ============================================================
  build-scanner:
    name: Build Scanner (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            artifact: scanner-win
          - os: macos-latest
            name: macos
            artifact: scanner-mac
          - os: ubuntu-latest
            name: linux
            artifact: scanner-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            choco install tesseract --no-progress -y
          elif [ "$RUNNER_OS" = "macOS" ]; then
            brew install tesseract
          else
            sudo apt-get update && sudo apt-get install -y tesseract-ocr libtesseract-dev
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install pyinstaller mss opencv-python pytesseract pillow pynput numpy

      - name: Prepare tessdata
        run: |
          cd scanner-engine
          mkdir -p tessdata
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp "C:/Program Files/Tesseract-OCR/tessdata/eng.traineddata" tessdata/
          elif [ "$RUNNER_OS" = "macOS" ]; then
            cp "$(brew --prefix)/share/tessdata/eng.traineddata" tessdata/
          else
            cp /usr/share/tesseract-ocr/5/tessdata/eng.traineddata tessdata/ 2>/dev/null || \
            cp /usr/share/tessdata/eng.traineddata tessdata/ 2>/dev/null || \
            echo "Warning: eng.traineddata not found, OCR may not work"
          fi

      - name: Build scanner executable
        run: cd scanner-engine && python build_scanner.py

      - name: Verify build
        run: |
          ls -la scanner-engine/dist/
          file scanner-engine/dist/* 2>/dev/null || true

      - name: Upload scanner artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: scanner-engine/dist/*
          retention-days: 30

  # ============================================================
  # Electron Overlay Build (Windows/macOS/Linux)
  # ============================================================
  build-overlay:
    name: Build Overlay (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            artifact: overlay-win
          - os: macos-latest
            name: macos
            artifact: overlay-mac
          - os: ubuntu-latest
            name: linux
            artifact: overlay-linux
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Install dependencies
        run: |
          cd electron-overlay
          npm ci

      - name: Build overlay
        run: |
          cd electron-overlay
          npm run build

      - name: Verify build
        run: |
          ls -la electron-overlay/dist/
          file electron-overlay/dist/* 2>/dev/null || true

      - name: Upload overlay artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: electron-overlay/dist/**
          retention-days: 30

  # ============================================================
  # Create GitHub Release
  # ============================================================
  release:
    name: Create Release
    needs: [build-scanner, build-overlay]
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: false

      - name: Organize release files
        run: |
          mkdir -p release
          mv artifacts/scanner-win/* release/ 2>/dev/null || true
          mv artifacts/scanner-mac/* release/ 2>/dev/null || true
          mv artifacts/scanner-linux/* release/ 2>/dev/null || true
          mv artifacts/overlay-win/* release/ 2>/dev/null || true
          mv artifacts/overlay-mac/* release/ 2>/dev/null || true
          mv artifacts/overlay-linux/* release/ 2>/dev/null || true
          cd release
          find . -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} + 2>/dev/null || true
          ls -la

      - name: Generate checksums
        run: |
          cd release
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -exec sha256sum {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          name: SC Price Scanner ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
          body: |
            ## SC Price Scanner

            ### Downloads
            - Windows scanner: SC-Price-Scanner.exe
            - macOS scanner: SC-Price-Scanner-mac (chmod +x first)
            - Linux scanner: SC-Price-Scanner-linux (chmod +x first)
            - Windows overlay: NSIS installer / portable exe
            - macOS overlay: dmg
            - Linux overlay: AppImage

            ### Usage (CLI scanner)
            1. Run the executable.
            2. Press F8 once to calibrate (click corners of the commodity terminal).
            3. In game: open the commodity kiosk, press F9 to scan.
            4. JSON scans are saved to ~/SC-Scans/.
            5. Drag the .json into the SC-Truckers Market page and click Import.

            ### Usage (Overlay)
            1. Run the overlay next to the scanner exe (same folder) so it can find it.
            2. It stays always-on-top.
            3. Click Scan Terminal or press F9 in game.
            4. Results appear in the overlay and a JSON is saved.

            ### Safety
            - No game injection, no memory reads, no hooks.
            - Uses standard desktop screen capture (same technology as OBS/Discord).
            - Runs as a normal user, no admin required.

            ### Checksums
            See SHA256SUMS.txt.
          draft: false
          prerelease: false
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
