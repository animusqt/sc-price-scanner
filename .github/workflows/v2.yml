name: V2 services

on:
  push:
    branches: [main, version-2]
  pull_request:
    branches: [main, version-2]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/api/requirements.txt
            services/ocr/requirements.txt
      - run: pip install -r services/api/requirements.txt -r services/ocr/requirements.txt
      - run: pytest -q
      - run: python -m compileall -q scanner-engine services/api/scip_api services/ocr/scip_ocr
      - name: Check database migration
        env:
          DATABASE_URL: sqlite:///./migration-test.db
          PYTHONPATH: services/api
        run: |
          alembic -c services/api/alembic.ini upgrade head
          alembic -c services/api/alembic.ini downgrade base
