<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SC Price Scanner Overlay</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <div id="app" class="overlay-window">
    <!-- Title bar -->
    <header class="title-bar" id="titleBar">
      <div class="title-bar-left">
        <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <span class="title">SC Price Scanner</span>
        <span class="version">v1.0</span>
      </div>
      <div class="title-bar-right">
        <button class="icon-btn" id="clickThroughBtn" title="Toggle click-through (hold Shift to drag)">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 8v8M8 12h8"/>
          </svg>
        </button>
        <button class="icon-btn" id="minimizeBtn" title="Minimize to tray">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14"/>
          </svg>
        </button>
        <button class="icon-btn danger" id="closeBtn" title="Quit">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main content -->
    <main class="content">
      <!-- Status card -->
      <section class="card" id="statusCard">
        <div class="card-header">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 6v6l4 2"/>
          </svg>
          <h3>Scanner Status</h3>
        </div>
        <div class="status-row">
          <span class="status-indicator" id="scannerStatus">
            <span class="dot"></span>
            <span class="label">Starting…</span>
          </span>
        </div>
        <div class="status-row">
          <span class="label">Last scan:</span>
          <span class="value" id="lastScan">—</span>
        </div>
        <div class="status-row">
          <span class="label">Commodities:</span>
          <span class="value" id="commodityCount">0</span>
        </div>
        <div class="status-row">
          <span class="label">Station:</span>
          <span class="value" id="stationName">—</span>
        </div>
      </section>

      <!-- Controls -->
      <section class="card">
        <div class="card-header">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="2" width="20" height="20" rx="2"/>
            <path d="M12 8v8M8 12h8"/>
          </svg>
          <h3>Actions</h3>
        </div>
        <div class="btn-group">
          <button class="btn btn-primary" id="scanBtn">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="12" r="4"/>
            </svg>
            <span>Scan Terminal (F9)</span>
            <kbd class="kbd">F9</kbd>
          </button>
          <button class="btn btn-secondary" id="calibrateBtn">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
            </svg>
            <span>Calibrate Region (F8)</span>
            <kbd class="kbd">F8</kbd>
          </button>
        </div>
        <p class="hint">Open commodity terminal in-game, then press <kbd>F9</kbd></p>
      </section>

      <!-- Recent scan preview -->
      <section class="card" id="previewCard" style="display:none">
        <div class="card-header">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <path d="M14 2v6h6"/>
            <path d="M16 13H8M16 17H8M10 9h8"/>
          </svg>
          <h3>Last Scan Preview</h3>
        </div>
        <div class="preview-table" id="previewTable"></div>
        <div class="preview-actions">
          <button class="btn btn-ghost" id="openScanFolder">Open Scan Folder</button>
          <button class="btn btn-primary" id="uploadToSite">Upload to SC-Truckers</button>
        </div>
      </section>

      <!-- Log console -->
      <section class="card">
        <div class="card-header">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19h16M4 15h16M10 11h6M10 7h6M4 3h16v16H4z"/>
          </svg>
          <h3>Activity Log</h3>
        </div>
        <div class="log-console" id="logConsole"></div>
      </section>
    </main>

    <!-- Resize handle -->
    <div class="resize-handle" id="resizeHandle"></div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
